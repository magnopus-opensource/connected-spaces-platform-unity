name: Make Release

on:
  # TODO: Remove push trigger before merging!
  push:
    branches:
      - 'feat/OPE-3178_Create-visionOS-workflow'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label (e.g., v0.0.2)'
        required: true
        default: 'v0.0.2'
      releaseName:
        description: 'Name of the release'
        required: true
      releaseTag:
        description: 'Custom Git tag (leave empty for automatic)'
        required: false
      is_official_release:
        description: 'Official release (pushes to release branches)'
        type: boolean
        default: false

env:
  DEFAULT_VERSION: '0.0.2'

jobs:
  prep-release:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.calc.outputs.tag }}
      version: ${{ steps.calc.outputs.version }}
      # TODO: Remove this test overridden official flag before merging!
      is_official: ${{ steps.calc.outputs.is_official }}
    steps:
      - id: calc
        run: |
          # Fallback to DEFAULT_VERSION if inputs don't exist (on push)
          VER="${{ github.event.inputs.version || env.DEFAULT_VERSION }}"
          
          # TODO: REMOVE BEFORE MERGING! Force official release behavior if triggered by a push
          IS_OFFICIAL="${{ github.event.inputs.is_official_release || 'false' }}"
          if [ "${{ github.event_name }}" == "push" ]; then
            IS_OFFICIAL="true"
          fi
          
          if [ -n "${{ github.event.inputs.releaseTag }}" ]; then
            TAG="${{ github.event.inputs.releaseTag }}"
          # TODO: Replace next line with the commented following one before merging!
          elif [ "$IS_OFFICIAL" == "true" ]; then
          #elif [ "${{ github.event.inputs.is_official_release }}" == "true" ]; then
            TAG="$VER"
          else
            # For manual test triggers, this will create a tag like 'test-0.0.2-42'
            TAG="test-${VER}-${{ github.run_number }}"
          fi
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VER" >> $GITHUB_OUTPUT
          # TODO: Remove next line before merging!
          echo "is_official=$IS_OFFICIAL" >> $GITHUB_OUTPUT
  
  # Run Unity Packaging
  package-unity:
    needs: prep-release
    uses: ./.github/workflows/make-release-unity.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.prep-release.outputs.version }}
      releaseTag: ${{ needs.prep-release.outputs.release_tag }}
      # TODO: Replace following line with the commented one before merging!
      is_official_release: ${{ needs.prep-release.outputs.is_official == 'true' }}
      #is_official_release: ${{ inputs.is_official_release == true || inputs.is_official_release == 'true' }}

  # Run DotNet Packaging
  package-dotnet:
    needs: prep-release
    uses: ./.github/workflows/make-release-dotnet.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.prep-release.outputs.version }}
      releaseTag: ${{ needs.prep-release.outputs.release_tag }}
      # TODO: Replace following line with the commented one before merging!
      is_official_release: ${{ needs.prep-release.outputs.is_official == 'true' }}
      #is_official_release: ${{ inputs.is_official_release == true || inputs.is_official_release == 'true' }}

  # Create the Release
  publish-release:
    needs: [prep-release, package-unity, package-dotnet]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Fallback name for push events
          name: ${{ github.event.inputs.releaseName || format('Release {0}', needs.prep-release.outputs.version) }}
          tag_name: ${{ needs.prep-release.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            release-artifacts/*.zip
            release-artifacts/*.tgz