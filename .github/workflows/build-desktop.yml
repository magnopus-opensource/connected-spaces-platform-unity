name: CMake Build Desktop

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      unity_ext_matrix:
        description: 'This parameter establishes whether SWIG should generate the additional bindings for supporting Unity applications (true) or just the code for supporting general purpose .NET C# applications (false). This is expected to be a JSON array: it is possible to produce both cases by passing [true, false].'
        required: false
        default: '[true, false]'
      platform_matrix:
        description: 'What platforms to run these checks on. Expected to be a JSON array ["windows-latest", "macos-latest"]'
        type: string
        required: false
        default: '["windows-latest", "macos-latest"]'
      csp_branch: 
        description: 'If set, will build a specific version of CSP from a CSP branch using the new cmake build system, then run with that.'
        type: string
        required: false
        default: ''
      csp_version: # The version of csp to download if csp_branch is not specified
        type: string
        required: false
        default: ''
  workflow_call: # Allows other workflows to call this one and wait for its artifacts
    inputs:
      unity_ext_matrix:
        type: string
        required: false
        default: '[true, false]'
      platform_matrix: # What platforms to run these checks on. Expected to be a JSON array ["windows-latest", "macos-latest"]
        type: string
        required: false
        default: '["windows-latest", "macos-latest"]'
      csp_branch: # If set, will build a specific version of CSP from a CSP branch using the new cmake build system, then run with that.
        type: string
        required: false
        default: ''
      binding_repo_branch: # Branch of this (.net bindings) repo to check out. Required when called from another repo so the local actions resolve correctly. Leave empty when running this workflow natively.
        type: string
        required: false
        default: ''
      csp_version: # The version of csp to download if csp_branch is not specified
        type: string
        required: false
        default: ''

env:
  BUILDING_FROM_BRANCH: ${{ inputs.csp_branch != '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform_matrix || '["windows-latest", "macos-latest"]') }}
        build_type: [Debug, Release]
        # If an input is provided, parse it. Otherwise, default to building both.
        build_with_unity_extensions: ${{ fromJSON(inputs.unity_ext_matrix || '[true, false]') }}

    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      # When called from another repo (workflow_call), the default checkout would target the
      # caller's repo because github.repository resolves to the caller. The binding_repo_branch input
      # is the explicit signal: caller passes the branch of this repo to check out.
      - name: Checkout (called from another repo)
        if: inputs.binding_repo_branch != ''
        uses: actions/checkout@v4
        with:
          repository: magnopus-opensource/connected-spaces-platform-unity
          ref: ${{ inputs.binding_repo_branch }}

      - name: Checkout (native)
        if: inputs.binding_repo_branch == ''
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.x'

      - name: Download CSP draft (Windows)
        if: env.BUILDING_FROM_BRANCH == 'false' && runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.CSP_TOKEN }}
          CSP_VERSION: ${{ inputs.csp_version || '999.999.9999' }}
          CSP_BUILD_TYPE: ${{ matrix.build_type == 'Debug' && 'relwithdebinfo' || 'release' }}
        run: |
          $ReleaseName = "CSP $env:CSP_VERSION"
          $AssetName = "windows-$env:CSP_BUILD_TYPE-shared.zip"
          $AssetPath = "./ThirdParty/CSP/$AssetName"
          $InstallPath = "./ThirdParty/CSP/install"

          $Releases = gh api `
            "repos/magnopus-opensource/connected-spaces-platform/releases?per_page=100" |
            ConvertFrom-Json

          $Release = $Releases |
            Where-Object { $_.draft -eq $true -and $_.name -eq $ReleaseName } |
            Select-Object -First 1

          if (-not $Release) {
            throw "Draft release '$ReleaseName' not found"
          }

          $Asset = $Release.assets |
            Where-Object { $_.name -eq $AssetName } |
            Select-Object -First 1

          if (-not $Asset) {
            throw "Asset '$AssetName' not found"
          }

          New-Item -ItemType Directory -Force -Path "./ThirdParty/CSP" | Out-Null

          gh api `
            "repos/magnopus-opensource/connected-spaces-platform/releases/assets/$($Asset.id)" `
            -H "Accept: application/octet-stream" `
            > $AssetPath

          New-Item -ItemType Directory -Force -Path $InstallPath | Out-Null
          Expand-Archive -Path $AssetPath -DestinationPath $InstallPath

      - name: Download CSP (Mac)
        if: env.BUILDING_FROM_BRANCH == 'false' && runner.os == 'macOS'
        shell: cmd
        run: |
          gh release download v%CSP_VERSION% ^
            --repo magnopus-opensource/connected-spaces-platform ^
            --pattern "macos-%CSP_BUILD_TYPE%-shared.zip" ^
            --dir ./ThirdParty/CSP
        env:
          GH_TOKEN: ${{ secrets.CSP_TOKEN }}
          CSP_VERSION: ${{ inputs.csp_version || '999.999.999' }}
          CSP_BUILD_TYPE: ${{ matrix.build_type == 'Debug' && 'relwithdebinfo' || 'release' }}

      - name: Build CSP (Windows)
        if: env.BUILDING_FROM_BRANCH == 'true' && runner.os == 'Windows'
        uses: ./.github/actions/build-csp-windows
        with:
          csp_branch: ${{inputs.csp_branch}}
          build_type: ${{ matrix.build_type }}

      - name: Build CSP (macOS)
        if: env.BUILDING_FROM_BRANCH == 'true' && runner.os == 'macOS'
        uses: ./.github/actions/build-csp-macos
        with:
          csp_branch: ${{inputs.csp_branch}}
          build_type: ${{ matrix.build_type }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DENABLE_UNITY_EXTENSIONS=${{ matrix.build_with_unity_extensions && 'ON' || 'OFF' }}
          -DCMAKE_PREFIX_PATH=${{ env.BUILDING_FROM_BRANCH == 'true'
            && format('{0}/CSP/install', github.workspace)
            || format('{0}/ThirdParty/CSP/install', github.workspace) }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} 
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ runner.job_count }}

      - name: Install
        run: cmake --install build --config ${{ matrix.build_type }}

      - name: Test
        # We cannot run XUnit tests with Unity extensions enabled because Unity classes would not be found causing a build failure.
        if: ${{ matrix.build_with_unity_extensions == false }}
        env:
          RUN_LONG_RUNNING_TESTS: 1
        run: | #TODO: Upload the .dmp file when this test fails for easier debugging.
          dotnet test -c ${{ matrix.build_type }} --logger "console;verbosity=detailed" --blame-hang --blame-hang-timeout 90s
        working-directory: ./InteropTestsXUnit

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.build_type }}${{ matrix.build_with_unity_extensions && '-Unity' || '-DotNet' }}
          path: install/**
          if-no-files-found: error
