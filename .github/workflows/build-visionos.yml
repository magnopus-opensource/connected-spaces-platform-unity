name: CMake Build visionOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      unity_ext_matrix:
        description: 'This parameter establishes whether SWIG should generate the additional bindings for supporting Unity applications (true) or just the code for supporting general purpose .NET C# applications (false).'
        required: false
        default: '[true]'
      target_sdk_matrix:
        description: 'Target SDKs: ["xros"] (Device), ["xrsimulator"] (Simulator), or both'
        required: false
        default: '["xros", "xrsimulator"]'
  workflow_call: # Allows other workflows to call this one and wait for its artifacts
    inputs:
      unity_ext_matrix:
        type: string
        required: false
        default: '[true]'
      target_sdk_matrix:
        type: string
        required: false
        default: '["xros", "xrsimulator"]'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        build_type: [Debug, Release]
        # If an input is provided, parse it. Otherwise, default to building with Unity extensions enabled.
        build_with_unity_extensions: ${{ fromJSON(inputs.unity_ext_matrix || '[true]') }}
        # Evaluate the target SDK dynamically
        target_sdk: ${{ fromJSON(inputs.target_sdk_matrix || '["xros", "xrsimulator"]') }}

    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      # Manually specify the OpenSSL configure target used by the Conan recipe,
      # as the OpenSSL 1.1 recipe does not fully support visionOS.
      - name: Set OpenSSL configuration for visionOS
        shell: bash
        run: |
          set -euo pipefail
          echo "CONAN_OPENSSL_CONFIGURATION=ios64-xcrun" >> "$GITHUB_ENV"

      - name: Install Conan
        run: |
          pip install "conan==2.27.0"
          mkdir -p "$HOME/.conan2/profiles"

          cat > "$HOME/.conan2/profiles/macos_ci" <<'EOF'
          [settings]
          os=Macos
          arch=armv8
          build_type=${{ matrix.build_type }}
          compiler=apple-clang
          compiler.version=17
          compiler.cppstd=17
          compiler.libcxx=libc++
          EOF

          cat "$HOME/.conan2/profiles/macos_ci"
          conan install . \
          --output-folder=build \
          --build=missing \
          -s build_type=${{ matrix.build_type }} \
          --profile:build=macos_ci \
          --profile:host=profiles/host/visionos_arm64 
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Configure
        shell: bash
        run: |
          cmake -S . \
            -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=visionOS \
            "-DCMAKE_OSX_SYSROOT=${{ matrix.target_sdk }}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=OFF \
            "-DENABLE_UNITY_EXTENSIONS=${{ matrix.build_with_unity_extensions && 'ON' || 'OFF' }}" \
            "-DCSP_BUILD_TYPE=${{ matrix.build_type }}" \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake
        env:
          # This is here temporarily so we can test using draft CSP builds.
          GH_TOKEN: ${{ secrets.CSP_TOKEN }}

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ runner.job_count }}

      - name: Install
        run: cmake --install build --config ${{ matrix.build_type }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          # Append the target_sdk to the artifact name so Device and Simulator files don't overwrite each other
          name: visionOS-${{ matrix.target_sdk }}-${{ matrix.os }}-${{ matrix.build_type }}${{ matrix.build_with_unity_extensions && '-Unity' || '-DotNet' }}
          path: install/**
          if-no-files-found: error